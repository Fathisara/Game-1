<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vecter Run</title>
<style>
:root{color-scheme:dark;--ink:#e4f4ff;--hot:#00f3ff;--magenta:#d400ff;--bg:#06080b}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%}
#xh{position:fixed;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid rgba(0,243,255,.9);border-radius:50%;box-shadow:0 0 8px rgba(0,243,255,.6);pointer-events:none}
#xh::after{content:'';position:absolute;inset:4px;background:#fff;border-radius:50%}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:22px;font-weight:700;letter-spacing:1px;text-shadow:0 2px 6px #000}
#hp{width:42vw;max-width:220px;height:12px;border:1px solid rgba(0,243,255,.6);background:rgba(0,0,0,.6);margin-top:6px;border-radius:3px;overflow:hidden}
#hpf{height:100%;width:100%;background:linear-gradient(90deg,#00f3ff,#0077ff);box-shadow:0 0 10px #00f3ff}
#dmg{position:fixed;inset:0;background:radial-gradient(transparent 35%,rgba(212,0,255,.45) 120%);opacity:0;pointer-events:none;transition:opacity .2s}
#ring{position:fixed;left:50%;top:50%;width:84vmin;height:84vmin;margin:-42vmin 0 0 -42vmin;pointer-events:none}
#ring .w{position:absolute;inset:0;background:conic-gradient(from -28deg,transparent,rgba(212,0,255,.9) 28deg,transparent 56deg);-webkit-mask:radial-gradient(circle closest-side,transparent 76%,#000 86%,#000 96%,transparent 100%);mask:radial-gradient(circle closest-side,transparent 76%,#000 86%,#000 96%,transparent 100%)}
#ar{width:42vw;max-width:220px;height:6px;border:1px solid rgba(212,0,255,.5);background:rgba(0,0,0,.5);margin-top:4px;border-radius:2px;overflow:hidden}
#arf{height:100%;width:0;background:#d400ff;box-shadow:0 0 8px #d400ff}
#hn{font-size:16px;margin-top:4px;color:#a8cce8}
#mm{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 48px);width:120px;height:120px;border:2px solid #00f3ff;border-radius:10px;background:rgba(6,12,20,.9);pointer-events:none;box-shadow:0 0 16px rgba(0,243,255,.35)}
#wp{position:fixed;right:calc(env(safe-area-inset-right,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 130px);font-size:20px;font-weight:700;letter-spacing:1px;text-shadow:0 2px 6px #000;pointer-events:none;color:#00f3ff}
#sw{position:fixed;right:calc(env(safe-area-inset-right,0px) + 128px);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:60px;height:60px;border-radius:50%;border:2px solid rgba(0,243,255,.6);background:rgba(6,16,28,.65);color:var(--ink);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#bb{position:fixed;left:18px;top:calc(env(safe-area-inset-top,0px) + 98px);width:42vw;max-width:220px;height:10px;border:1px solid #ff0055;display:none;pointer-events:none;background:rgba(0,0,0,.6)}
#bbf{height:100%;width:100%;background:#ff0055;box-shadow:0 0 8px #ff0055}
#toast{position:fixed;left:50%;top:28%;transform:translateX(-50%);font-size:24px;font-weight:800;letter-spacing:1px;opacity:0;transition:opacity .25s;pointer-events:none;text-shadow:0 0 12px rgba(0,243,255,.8);color:#fff;white-space:nowrap}
#fire{position:fixed;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:92px;height:92px;border-radius:50%;border:2px solid #00f3ff;background:radial-gradient(circle,rgba(0,243,255,.3) 0%,rgba(6,16,28,.7) 80%);color:#fff;font:800 20px inherit;letter-spacing:1.5px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(0,243,255,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#fire:active{background:rgba(0,243,255,.55);box-shadow:0 0 24px rgba(0,243,255,.8)}
#base{position:fixed;width:104px;height:104px;margin:-52px 0 0 -52px;border:2px solid rgba(0,243,255,.35);border-radius:50%;display:none;pointer-events:none;background:radial-gradient(circle,rgba(0,243,255,.08) 0%,transparent 70%)}
#knob{position:absolute;left:32px;top:32px;width:40px;height:40px;border-radius:50%;background:rgba(0,243,255,.7);box-shadow:0 0 12px #00f3ff}
#hint{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 50px);font-size:16px;letter-spacing:1px;color:#6fa5cb;opacity:.65;pointer-events:none}
#ov{position:fixed;inset:0;background:rgba(4,6,10,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#ov h1{font-size:56px;margin:0;letter-spacing:3px;color:#00f3ff;text-shadow:0 0 20px rgba(0,243,255,.6);text-transform:uppercase}
#ov p{font-size:20px;margin:14px 0 28px;max-width:340px;line-height:1.3;color:#8fa7c2}
#ov button{font:800 24px inherit;letter-spacing:2px;background:linear-gradient(135deg,#00f3ff,#0072ff);color:#02060c;border:0;padding:14px 44px;border-radius:30px;box-shadow:0 0 20px rgba(0,243,255,.5);text-transform:uppercase}
</style></head><body>
<canvas id="c"></canvas>
<div id="xh"></div><div id="dmg"></div><div id="ring"></div>
<div id="hud"><div><div id="wv" style="color:#00f3ff">WAVE 1</div><div id="hp"><div id="hpf"></div></div><div id="ar"><div id="arf"></div></div><div id="hn">SHIELD 100</div></div><div id="ks" style="color:#a8cce8">ELIMINATIONS 0</div></div>
<div id="base"><div id="knob"></div></div>
<div id="hint">MOVE</div>
<div id="fire">FIRE</div><canvas id="mm"></canvas><div id="wp"></div><div id="sw">SWAP</div><div id="toast"></div><div id="bb"><div id="bbf"></div></div>
<div id="ov"><h1 id="t">VECTER RUN</h1><p id="s">Left thumb moves. Right thumb aims. Eliminate the hostile operatives.</p><button id="go">INITIALIZE</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>

<script>
let M=[];
const cv=document.getElementById('c'),$=id=>document.getElementById(id),FOV=1.3;
let px,py,a,hp,wave,kills,en,cd,fl8,kick,running=false,firing=false,mx=0,my=0,bob=0,over=false,pitch=0;
const wall=(x,y)=>M[y|0]?.[x|0]!=='0';const tall=(x,y)=>{const c=M[y|0]?.[x|0];return c===undefined||c==='1'};
function hasLOS(x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/.15);for(let i=1;i<n;i++){const t=i/n;if(tall(x1+(x2-x1)*t,y1+(y2-y1)*t))return false}return true}

const vTemp=new THREE.Vector3();

// 3D MODEL PIPELINE
let BASE_MODEL=null,ANIMATIONS=[];
let FACE=0,FB=false;
const goBtn=$('go');goBtn.textContent='CONNECTING CYBER-GRID...';goBtn.disabled=true;
function ready(){goBtn.textContent='INITIALIZE';goBtn.disabled=false}
function useFallback(){if(BASE_MODEL||FB)return;FB=true;ready()}
function onGLB(gltf){BASE_MODEL=gltf.scene;ANIMATIONS=gltf.animations;BASE_MODEL.updateMatrixWorld(true);let rh=null,lh=null;
BASE_MODEL.traverse(o=>{if(o.isBone){if(/RightHand$/i.test(o.name))rh=o;if(/LeftHand$/i.test(o.name))lh=o}});
if(rh&&lh){const p=new THREE.Vector3(),q=new THREE.Vector3();rh.getWorldPosition(p);lh.getWorldPosition(q);FACE=p.x<q.x?0:Math.PI}ready()}
if(typeof THREE.GLTFLoader==='undefined'||typeof THREE.SkeletonUtils==='undefined'){useFallback()}
else{const loader=new THREE.GLTFLoader();
if(window.GLB_B64){const bin=atob(window.GLB_B64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);loader.parse(u8.buffer,'',onGLB,useFallback)}
else{loader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/models/gltf/Soldier.glb',onGLB,undefined,useFallback);setTimeout(useFallback,8000)}}

function mkFallback(e){const root=new THREE.Group(),body=new THREE.Group(),neon=e.t===4?0xd400ff:0x00f3ff,s=TY[e.t].s;root.add(body);
const dark=new THREE.MeshStandardMaterial({color:0x18202c,metalness:.6,roughness:.4}),coat=new THREE.MeshStandardMaterial({color:0x12151c,roughness:.8}),arm=new THREE.MeshStandardMaterial({color:0x4b5a78,metalness:.5,roughness:.4}),glow=new THREE.MeshBasicMaterial({color:neon}),skin=new THREE.MeshStandardMaterial({color:0xb98062}),vis=new THREE.MeshStandardMaterial({color:0x1a0b2e});
const bx=(m,w,h,d,x,y,z,p)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;(p||body).add(o);return o};
const piv=(x,y)=>{const p=new THREE.Group();p.position.set(x,y,0);body.add(p);return p};
const lg=piv(-.13,.62),rg=piv(.13,.62);
for(const p of [lg,rg]){bx(dark,.2,.62,.22,0,-.31,0,p);bx(coat,.22,.12,.3,0,-.56,.04,p);bx(glow,.14,.03,.02,0,-.5,.17,p)}
const cyl=new THREE.Mesh(new THREE.CylinderGeometry(.27,.36,.8,8),coat);cyl.position.set(0,.85,0);cyl.scale.z=.7;cyl.castShadow=true;body.add(cyl);
bx(arm,.62,.5,.38,0,1.3,.01);bx(glow,.04,.3,.02,-.1,1.3,.2).rotation.z=.5;bx(glow,.04,.3,.02,.1,1.3,.2).rotation.z=-.5;
for(const sx of [-1,1]){bx(arm,.3,.2,.4,sx*.4,1.5,0).rotation.z=-sx*.25;bx(coat,.1,.3,.3,sx*.2,1.62,-.02)}
bx(arm,.5,.45,.08,0,1.3,-.22);bx(glow,.12,.12,.02,0,1.3,-.27).rotation.z=.785;
const head=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),arm);head.position.set(0,1.68,0);head.scale.y=.92;head.castShadow=true;body.add(head);
bx(vis,.34,.13,.12,0,1.66,.17);bx(glow,.3,.02,.02,0,1.74,.23);bx(glow,.08,.1,.02,-.06,1.66,.24);bx(skin,.14,.07,.1,0,1.5,.16);
bx(coat,.14,.55,.17,-.4,1.3,0);bx(arm,.14,.5,.18,.4,1.3,.1).rotation.x=-1.1;
body.scale.setScalar(s);
const rifle=buildEnemyRifle(neon);root.add(rifle);
root.userData={rifle,muzzle:rifle.userData.muzzle,legs:[lg,rg],body,rfp:new THREE.Vector3(.38*s,1.1*s,.3*s)};return root}

function spawn(){
  wave++;scatter(5);
  if(wave>1){toast('WAVE '+wave+(wave%5===0?' · COMMANDER DEPLOYED':' · OPERATIVES INCOMING'));sfx.wave()}
  $('wv').textContent='WAVE '+wave;en=[];
  const n=wave%5===0?3:Math.min(14,2+wave);let g=0;
  while(en.length<n&&g++<500){
    const c=OPEN[(Math.random()*OPEN.length)|0],x=c[0]+.5,y=c[1]+.5,dd=Math.hypot(x-px,y-py);
    if(dd>(g>300?6:10)&&dd<(g>300?80:24)){
      const t=(wave%5===0&&!en.some(q=>q.t===4))?4:pickT(),T=TY[t],w=wave-1,hv=Math.round(T.hp*(1+.12*w));
      en.push({x,y,t,hp:hv,mhp:hv,sp:T.sp*Math.min(1.7,1+.04*w),dm:T.dm*(1+.05*w),cdm:Math.max(.45,1-.04*w),hc:Math.min(.9,T.hc+.01*w),cd:1+Math.random()*1.5,fl:0});
    }
  }
}

function reset(){
  hits.splice(0).forEach(h=>h.el.remove());rks.splice(0).forEach(r=>{sc.remove(r.m);sc.remove(r.g)});
  newWorld();ammo=40;ar=50;cur='carbine';have={carbine:1};px=N/2+.5;py=N/2+.5;a=0.8;hp=100;wave=0;kills=0;cd=0;fl8=0;kick=0;over=false;
  $('ks').textContent='ELIMINATIONS 0';spawn();hud();
}

function move(dx,dy){const r=.22;if(!wall(px+dx+Math.sign(dx)*r,py))px+=dx;if(!wall(px,py+dy+Math.sign(dy)*r))py+=dy}

let pk=[],ammo=40,ar=50,cur='carbine',have={carbine:1};
const WS={carbine:{cd:.18,tol:.34,dmg:1.2,cost:1},smg:{cd:.09,tol:.38,dmg:.8,cost:1},scatter:{cd:.65,tol:.85,dmg:3.5,cost:2,r:7}};
const mm=$('mm'),mc=mm.getContext('2d');mm.width=mm.height=128;

function hud(){$('hpf').style.width=hp+'%';$('hn').textContent='INTEGRITY '+Math.ceil(hp);$('arf').style.width=ar+'%';$('wp').textContent=cur.toUpperCase()+' · '+ammo}
function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,1400)}
function scatter(n){const K=['med','ammo','ammo','armor','smg','scatter'];let g=0;while(n>0&&pk.length<18&&g++<300){const c=(Math.random()<.6&&LOOT.length)?LOOT[(Math.random()*LOOT.length)|0]:OPEN[(Math.random()*OPEN.length)|0],x=c[0]+.5,y=c[1]+.5;if(!pk.some(q=>q.x===x&&q.y===y)){pk.push({x,y,k:K[(Math.random()*6)|0]});n--}}}
function drop(x,y){const K=['med','ammo','armor','smg','scatter'];pk.push({x,y,k:K[(Math.random()*5)|0]})}

function grab(p){
  sfx.pick();const k=p.k;
  if(k==='med'){hp=Math.min(100,hp+35);toast('+35 REPAIR')}
  else if(k==='ammo'){ammo+=35;toast('+35 CELLS')}
  else if(k==='armor'){ar=Math.min(100,ar+50);toast('+50 SHIELD')}
  else if(k==='drop'){hp=Math.min(100,hp+40);ar=Math.min(100,ar+60);ammo+=60;const L=['smg','scatter'].filter(q=>!have[q]);if(L.length){have[L[0]]=1;cur=L[0]}toast('AIRDROP SECURED')}
  else{const nw=!have[k];have[k]=1;if(nw)cur=k;ammo+=25;toast(nw?k.toUpperCase()+' ACQUIRED':'+25 CELLS')}
  hud();
}

function swap(){const o=Object.keys(have);cur=o[(o.indexOf(cur)+1)%o.length];hud()}
$('sw').addEventListener('touchstart',e=>{e.preventDefault();swap()});$('sw').addEventListener('click',swap);

// TACTICAL RADAR (local window, north-up)
function drawMap(){const R2=14,s=128/(2*R2),ox=px-R2,oy=py-R2,X=x=>(x-ox)*s,Y=y=>(y-oy)*s;
mc.fillStyle='rgba(8,16,26,.92)';mc.fillRect(0,0,128,128);
for(let y=Math.max(0,Math.floor(oy));y<Math.min(N,Math.ceil(oy+2*R2));y++)for(let x=Math.max(0,Math.floor(ox));x<Math.min(N,Math.ceil(ox+2*R2));x++){const c=M[y][x];if(c==='0')continue;mc.fillStyle=c==='1'?'#2a4a68':'#8a5a24';mc.fillRect(X(x),Y(y),s+.5,s+.5)}
mc.fillStyle='rgba(120,255,40,.4)';for(const p of POOLS){mc.beginPath();mc.arc(X(p.x),Y(p.y),p.r*s,0,7);mc.fill()}
mc.fillStyle='#00f3ff';for(const p of PADS)mc.fillRect(X(p.x)-2,Y(p.y)-2,4,4);
for(const p of pk){let x=X(p.x),y=Y(p.y);if(p.k==='drop'){x=Math.max(6,Math.min(122,x));y=Math.max(6,Math.min(122,y));mc.fillStyle='#ffc233';mc.beginPath();mc.arc(x,y,5,0,7);mc.fill();continue}mc.fillStyle=p.k==='med'?'#00ff88':p.k==='armor'?'#d400ff':'#ffcc00';mc.fillRect(x-2,y-2,5,5)}
mc.fillStyle='#ff7a1a';for(const b of BARRELS)mc.fillRect(X(b.x+.5)-2,Y(b.y+.5)-2,4,4);
for(const e of en){const x=X(e.x),y=Y(e.y);if(x<0||y<0||x>128||y>128)continue;mc.fillStyle=e.t===4?'#ff0055':'#ff2244';mc.beginPath();mc.arc(x,y,e.t===4?5.5:3.5,0,7);mc.fill();mc.fillStyle='#fff';mc.beginPath();mc.arc(x,y,1.5,0,7);mc.fill()}
mc.fillStyle='rgba(0,243,255,.32)';mc.beginPath();mc.moveTo(64,64);mc.arc(64,64,34,a-FOV/2,a+FOV/2);mc.closePath();mc.fill();
mc.fillStyle='#fff';mc.beginPath();mc.moveTo(64+Math.cos(a)*6.5,64+Math.sin(a)*6.5);mc.lineTo(64+Math.cos(a+2.5)*4.5,64+Math.sin(a+2.5)*4.5);mc.lineTo(64+Math.cos(a-2.5)*4.5,64+Math.sin(a-2.5)*4.5);mc.closePath();mc.fill()}

const hits=[];function addHit(w){const el=document.createElement('div');el.className='w';$('ring').appendChild(el);hits.push({w,t:1.2,el})}
function hurt(n,ang){
  sfx.hurt();if(ar>0){const ab=Math.min(ar,n*.6);ar-=ab;n-=ab}
  hp-=n;if(ang!==undefined)addHit(ang);hud();$('dmg').style.opacity=1;setTimeout(()=>$('dmg').style.opacity=0,150);
  if(hp<=0){hp=0;over=true;running=false;sfx.over();$('t').textContent='SIGNAL LOST';$('s').textContent='Sector cleared to Wave '+wave+' · '+kills+' Eliminations.';$('go').textContent='REBOOT';$('ov').style.display='flex'}
  $('hpf').style.width=hp+'%';
}

// SPARK PARTICLES
const sparks=[];
const GEO_SPARK=new THREE.BoxGeometry(.14,.14,.14);
const MAT_SPARK_CYAN=new THREE.MeshBasicMaterial({color:0x00f3ff});
const MAT_SPARK_MAG=new THREE.MeshBasicMaterial({color:0xd400ff});

function spawnHitSparks(pos,colorHex){
  const mat=colorHex===0xd400ff?MAT_SPARK_MAG:MAT_SPARK_CYAN;
  for(let i=0;i<8;i++){
    const m=new THREE.Mesh(GEO_SPARK,mat);
    m.position.copy(pos);
    sc.add(m);
    const vel=new THREE.Vector3((Math.random()-.5)*7,(Math.random()*5)+1,(Math.random()-.5)*7);
    sparks.push({m,vel,t:.2});
  }
}

function shoot(){
  const w=WS[cur];
  if(ammo<w.cost){sfx.click();cur='carbine';cd=.2;hud();toast('ENERGY DEPLETED');return}
  ammo-=w.cost;cd=w.cd;fl8=.07;kick=1;sfx[cur]();hud();
  let best=null,bd=99;
  for(const e of en){
    const dx=e.x-px,dy=e.y-py,d=Math.hypot(dx,dy);
    let yawDiff=Math.atan2(dy,dx)-a;
    yawDiff=Math.atan2(Math.sin(yawDiff),Math.cos(yawDiff));
    
    const expectedPitch=Math.atan2(0.8, d*S);
    const pitchDiff=Math.abs(pitch-expectedPitch);
    const tol=(w.tol*(e.t===4?2.2:1))/d;

    if(Math.abs(yawDiff)<Math.atan(tol)&&pitchDiff<Math.atan(tol*1.4)&&d<bd&&d<(w.r||99)&&hasLOS(px,py,e.x,e.y)){
      best=e;bd=d;
    }
  }
  {let bb=null,bbd=bd;for(const b of BARRELS){const dx=b.x+.5-px,dy=b.y+.5-py,d=Math.hypot(dx,dy);let yd=Math.atan2(dy,dx)-a;yd=Math.atan2(Math.sin(yd),Math.cos(yd));if(Math.abs(yd)<Math.atan(.45/d)&&d<bbd&&d<(w.r||99)&&hasLOS(px,py,b.x+.5,b.y+.5)){bb=b;bbd=d}}if(bb){explode(bb);return}}
  if(best){
    sfx.hit();best.hp-=w.dmg;
    spawnHitSparks(new THREE.Vector3(best.x*S,1.6,best.y*S),best.t===4?0xd400ff:0x00f3ff);
    
    if(best.hp<=0){
      en.splice(en.indexOf(best),1);kills++;sfx.kill();
      if(best.t===4){drop(best.x,best.y);drop(best.x,best.y);toast('COMMANDER DOWN')}
      else if(Math.random()<.35)drop(best.x,best.y);
      $('ks').textContent='ELIMINATIONS '+kills;
      if(!en.length){hp=Math.min(100,hp+20);hud();toast('SECTOR SECURED +20');setTimeout(()=>running&&spawn(),1200)}
    }
  }
}

let dmap=null,dcell=-1;const D4=[[1,0],[-1,0],[0,1],[0,-1]];
function flow(){const c=(py|0)*N+(px|0);if(c===dcell)return;dcell=c;dmap=new Int16Array(N*N).fill(-1);const q=[c];dmap[c]=0;
for(let i=0;i<q.length;i++){const k=q[i],x=k%N,y=(k/N)|0;for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=N||ny>=N||M[ny][nx]!=='0'||dmap[ny*N+nx]>=0)continue;dmap[ny*N+nx]=dmap[k]+1;q.push(ny*N+nx)}}}

dropT-=dt;if(dropT<=0&&!pk.some(q=>q.k==='drop')){dropT=30;const c=OPEN.filter(q=>{const d=Math.hypot(q[0]+.5-px,q[1]+.5-py);return d>9&&d<22});if(c.length){const q=c[(Math.random()*c.length)|0];pk.push({x:q[0]+.5,y:q[1]+.5,k:'drop'});toast('AIRDROP INBOUND');sfx.wave()}}}
function mkDrop(){const g=new THREE.Group(),b=new THREE.Group();g.userData.b=b;g.add(b);
b.add(new THREE.Mesh(new THREE.BoxGeometry(1.4,1.1,1.4),new THREE.MeshStandardMaterial({color:0x2b2410,emissive:0xffb020,emissiveIntensity:.9,roughness:.4,metalness:.6})),new THREE.Mesh(new THREE.BoxGeometry(1.45,.25,1.45),new THREE.MeshBasicMaterial({color:0xffd24a})));
const beam=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,70,10,1,true),new THREE.MeshBasicMaterial({color:0xffc233,transparent:true,opacity:.28,side:THREE.DoubleSide,depthWrite:false}));beam.position.y=35;g.add(beam);
const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.06,6,24),new THREE.MeshBasicMaterial({color:0xffc233}));ring.rotation.x=Math.PI/2;g.add(ring);return g}

// BOLD HIGH-VISIBILITY CYBER-RIFLE MODEL
function buildEnemyRifle(neonHex){
  const g=new THREE.Group();
  const matGun=new THREE.MeshStandardMaterial({color:0x1b222d,roughness:.3,metalness:.85});
  const matNeon=new THREE.MeshBasicMaterial({color:neonHex}); // Max-brightness neon

  // Rifle Body
  const body=new THREE.Mesh(new THREE.BoxGeometry(.14,.18,.75),matGun);
  body.position.set(0,0,.15);g.add(body);
  
  // Magazine
  const mag=new THREE.Mesh(new THREE.BoxGeometry(.08,.24,.14),matGun);
  mag.position.set(0,-.16,.1);g.add(mag);

  // Barrel & Suppressor
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.5,8),matGun);
  barrel.rotation.x=Math.PI/2;barrel.position.set(0,.03,.6);g.add(barrel);
  
  const supp=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.4,10),matGun);
  supp.rotation.x=Math.PI/2;supp.position.set(0,.03,.9);g.add(supp);

  // Glowing Neon Top Energy Rail & Under-Barrel Line
  const topRail=new THREE.Mesh(new THREE.BoxGeometry(.1,.06,.55),matNeon);
  topRail.position.set(0,.12,.15);g.add(topRail);

  const underLaser=new THREE.Mesh(new THREE.BoxGeometry(.06,.06,.45),matNeon);
  underLaser.position.set(0,-.06,.55);g.add(underLaser);

  // Muzzle Ring
  const mRing=new THREE.Mesh(new THREE.TorusGeometry(.065,.018,6,16),matNeon);
  mRing.position.set(0,.03,1.1);g.add(mRing);

  // Muzzle Anchor
  const muzzle=new THREE.Object3D();
  muzzle.position.set(0,.03,1.2);
  g.add(muzzle);
  g.userData.muzzle=muzzle;

  return g;
}

// "VECTER" CYBER OPERATIVE BUILDER
function mkSkinnedEnemy(e){
  const root=new THREE.Group();
  if(!BASE_MODEL)return mkFallback(e);

  const clone=THREE.SkeletonUtils.clone(BASE_MODEL);
  clone.scale.setScalar(TY[e.t].s);clone.rotation.y=FACE;
  root.add(clone);

  const isBoss=e.t===4;
  const neonHex=isBoss?0xd400ff:0x00f3ff;

  // Search bones with robust fuzzy matching
  let rHandBone=null,spineBone=null;
  clone.traverse(o=>{
    if(o.isBone){
      if(/RightHand$/i.test(o.name))rHandBone=o;
      if(/Spine2$/i.test(o.name))spineBone=o;
    }
    // Deep Obsidian Armor with Glowing Neon Visor
    if(o.isMesh&&o.material){
      o.material=o.material.clone();
      o.material.skinning=true;

      if(o.name==='vanguard_visor'){
        o.material.color.setHex(neonHex);
        o.material.emissive=new THREE.Color(neonHex);
        o.material.emissiveIntensity=2.6;
      }else{
        o.material.color.setHex(0x18202c);
        o.material.metalness=0.85;
        o.material.roughness=0.35;
        o.material.emissive.setHex(0x000000);
        o.material.emissiveIntensity=0;
      }
    }
  });

  // Glowing Chest Energy Core (Matches "VECTER" Concept)
  const coreMat=new THREE.MeshBasicMaterial({color:neonHex});
  const chestCore=new THREE.Mesh(new THREE.OctahedronGeometry(.18),coreMat);
  root.add(chestCore);

  // Tactical Rifle Attached to Root (Scale 1.0x - Never Compressed!)
  const rifle=buildEnemyRifle(neonHex);
  // Default forward tactical position
  rifle.position.set(-0.35,1.35,0.35);
  root.add(rifle);

  // Animation Controller
  const mixer=new THREE.AnimationMixer(clone);
  const runClip=THREE.AnimationClip.findByName(ANIMATIONS,'Run');
  const idleClip=THREE.AnimationClip.findByName(ANIMATIONS,'Idle');
  
  const runAction=runClip?mixer.clipAction(runClip):null;
  const idleAction=idleClip?mixer.clipAction(idleClip):null;
  if(idleAction)idleAction.play();

  root.userData={
    clone,mixer,runAction,idleAction,
    rHandBone,spineBone,rifle,chestCore,
    muzzle:rifle.userData.muzzle,
    currentAction:idleAction,isMoving:false
  };
  return root;
}

// 1st Person Player Gun
const gp=new THREE.Group(),vm={};
const M_ARMOR=new THREE.MeshStandardMaterial({color:0x1a212b,roughness:.5,metalness:.6});
const M_CYBER=new THREE.MeshStandardMaterial({color:0x8898a8,roughness:.2,metalness:.95});

function mkPlayerGun(k){
  const g=new THREE.Group();

  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.5,10),M_CYBER);

  const supp=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.45,12),M_COAT);

['carbine','smg','scatter'].forEach(k=>{vm[k]=mkPlayerGun(k);gp.add(vm[k])});
const fx=new THREE.Mesh(new THREE.SphereGeometry(.14,10,8),new THREE.MeshBasicMaterial({color:0x00f3ff}));
fx.position.set(0,.02,-1.2);gp.add(fx);cam.add(gp);

function mkPick(k){if(k==='drop')return mkDrop();
  const g=new THREE.Group(),b=new THREE.Group();g.userData.b=b;g.add(b);
  const c=k==='med'?0x00ff88:k==='armor'?0xd400ff:0x00f3ff;
  const m=new THREE.Mesh(new THREE.OctahedronGeometry(.5),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.5,roughness:.2}));
  b.add(m);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.7,.04,6,24),new THREE.MeshBasicMaterial({color:c}));
  ring.rotation.x=Math.PI/2;g.add(ring);

}

const em=new Map(),pm=new Map(),trs=[];
function sync(list,map,mk,fn){
  for(const[o,m]of map)if(!list.includes(o)){sc.remove(m);map.delete(o)}
  for(const o of list){let m=map.get(o);if(!m){m=mk(o);sc.add(m);map.set(o,m)}fn(o,m)}
}

const rks=[];
function boom(x,z){
  const m=new THREE.Mesh(GEO_BOOM,new THREE.MeshBasicMaterial({color:0xd400ff,transparent:true,opacity:.75}));
  m.position.set(x,1.5,z);sc.add(m);trs.push({m,t:.25});sfx.boom();
}
function rocket(e){
  const m=new THREE.Mesh(GEO_ROCKET,M_NEON_MAGENTA);
  const g=new THREE.Mesh(GEO_RING,new THREE.MeshBasicMaterial({color:0xd400ff,transparent:true,opacity:.6,side:THREE.DoubleSide}));
  g.rotation.x=-Math.PI/2;g.position.set(px*S,.05,py*S);m.position.set(e.x*S,3.5,e.y*S);sc.add(m,g);
  rks.push({m,g,x0:e.x*S,z0:e.y*S,tx:px*S,tz:py*S,t:0});
}
function stepRk(dt){
  for(let i=rks.length-1;i>=0;i--){
    const r=rks[i];r.t+=dt;const k=Math.min(1,r.t/1.1);
    r.m.position.set(r.x0+(r.tx-r.x0)*k,3.5*(1-k)+Math.sin(k*Math.PI)*2.4,r.z0+(r.tz-r.z0)*k);
    if(k>=1){sc.remove(r.m);sc.remove(r.g);rks.splice(i,1);boom(r.tx,r.tz);if(Math.hypot(px*S-r.tx,py*S-r.tz)<S*1.2)hurt(32,Math.atan2(r.tz/S-py,r.tx/S-px))}
  }
}
function bossBar(){const b=en.find(q=>q.t===4);$('bb').style.display=b?'block':'none';if(b)$('bbf').style.width=Math.max(0,b.hp/b.mhp*100)+'%'}

function tracer(e){
  let g=Math.atan2(e.y-py,e.x-px)-a;g=Math.atan2(Math.sin(g),Math.cos(g));
  const dist=Math.hypot(e.x-px,e.y-py);
  sfx.eshot(Math.sin(g),Math.max(.25,1-dist/14));

  const a1=new THREE.Vector3();
  const mRoot=em.get(e);
  if(mRoot&&mRoot.userData.muzzle){
    mRoot.userData.muzzle.getWorldPosition(a1);
  }else{
    a1.set(e.x*S,1.6,e.y*S);
  }

  const b1=new THREE.Vector3(px*S+(Math.random()-.5)*1.2,2+(Math.random()-.5),py*S+(Math.random()-.5)*1.2);
  const m=new THREE.Mesh(GEO_TRACER,new THREE.MeshBasicMaterial({color:0xd400ff}));
  m.scale.z=a1.distanceTo(b1);m.position.copy(a1).lerp(b1,.5);m.lookAt(b1);sc.add(m);trs.push({m,t:.1});
}

function draw(dt){
  dt=dt||0;const tm=performance.now()/1000;
  cam.position.set(px*S,2.3+Math.sin(bob)*.06,py*S);
  cam.rotation.y=-a-Math.PI/2;cam.rotation.x=pitch;
  PL.forEach((l,i)=>l.position.set(px*S+(i&1?-10:10),5.5,py*S+(i&2?-10:10)));PM.opacity=.38+.14*Math.sin(tm*3);PDM.opacity=.3+.15*Math.sin(tm*5);

  sync(en,em,e=>mkSkinnedEnemy(e),(e,m)=>{
    const dx=px-e.x,dy=py-e.y,mv=!!e.mv;
    m.position.set(e.x*S,0,e.y*S);
    m.rotation.y=(e.fa!==undefined?e.fa:Math.atan2(dx,dy));

    const u=m.userData;
    if(u.mixer){
      u.mixer.update(dt);
      if(u.runAction&&u.idleAction){
        if(mv&&!u.isMoving){
          u.idleAction.fadeOut(0.2);
          u.runAction.reset().fadeIn(0.2).play();
          u.isMoving=true;
        }else if(!mv&&u.isMoving){
          u.runAction.fadeOut(0.2);
          u.idleAction.reset().fadeIn(0.2).play();
          u.isMoving=false;
        }
      }

      // CRITICAL: Forces CPU bone matrix recalculation so hand position is never (0,0,0)
      u.clone.updateWorldMatrix(true,true);
    }

    m.updateMatrixWorld();

    if(u.legs){u.ph=(u.ph||0)+(mv?dt*9:0);const sw=mv?Math.sin(u.ph)*.8:0;u.legs[0].rotation.x=sw;u.legs[1].rotation.x=-sw;u.body.position.y=mv?Math.abs(Math.sin(u.ph))*.08:0}
    // Lock weapon directly to animated right palm
    if(u.rifle){
      if(u.rHandBone){
        u.rHandBone.getWorldPosition(vTemp);
        m.worldToLocal(vTemp);
        u.rifle.position.set(vTemp.x,vTemp.y+.04,vTemp.z+.15);
      }else{
        // Stable tactical chest grip fallback
        if(u.rfp)u.rifle.position.copy(u.rfp);else u.rifle.position.set(-0.35,1.35,0.35);
      }
      u.rifle.rotation.set(0,0,0);
    }

    // Lock glowing core to chest
    if(u.chestCore){
      if(u.spineBone){
        u.spineBone.getWorldPosition(vTemp);
        m.worldToLocal(vTemp);
        u.chestCore.position.set(vTemp.x,vTemp.y,vTemp.z+.22);
      }else{
        u.chestCore.position.set(0,1.5,.22);
      }
    }
  });

  sync(pk,pm,p=>mkPick(p.k),(p,m)=>{
    m.position.set(p.x*S,p.k==='drop'?Math.max(0,30-(p.t=(p.t||0)+dt)*9):0,p.y*S);
    m.userData.b.rotation.y=tm*2.5;
    m.userData.b.position.y=1.2+Math.sin(tm*3.5)*.18;
  });

  for(const k in vm)vm[k].visible=k===cur;
  gp.position.set(.28+Math.sin(bob*.5)*.01,-.3+Math.abs(Math.cos(bob))*.012,-.5+kick*.14);
  gp.rotation.x=kick*.12;fx.visible=fl8>0;

  for(let i=trs.length-1;i>=0;i--){const t=trs[i];t.t-=dt;if(t.t<=0){sc.remove(t.m);trs.splice(i,1)}}
  R.render(sc,cam);drawMap();
}

// Controls
const keys={};addEventListener('keydown',e=>{const m={w:'w',a:'a',s:'s',d:'d',ArrowLeft:'l',ArrowRight:'r',' ':'f'}[e.key];if(m)keys[m]=1});addEventListener('keyup',e=>{const m={w:'w',a:'a',s:'s',d:'d',ArrowLeft:'l',ArrowRight:'r',' ':'f'}[e.key];if(m)keys[m]=0});
let jid=null,jx=0,jy=0,lid=null,lx=0,ly=0,fid=null,fx0=0,fy0=0;const base=$('base'),knob=$('knob');

document.addEventListener('touchstart',e=>{
  if(e.target.closest('#ov'))return;e.preventDefault();
  for(const t of e.changedTouches){
    if(t.target.id==='fire'||t.target.id==='sw')continue;
    if(t.clientX<innerWidth/2&&jid===null){
      jid=t.identifier;jx=t.clientX;jy=t.clientY;base.style.display='block';base.style.left=jx+'px';base.style.top=jy+'px';$('hint').style.display='none';
    }else if(t.clientX>=innerWidth/2&&lid===null){lid=t.identifier;lx=t.clientX;ly=t.clientY}
  }
},{passive:false});

document.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===fid){firing=true;a+=(t.clientX-fx0)*.009;pitch=Math.max(-.5,Math.min(.5,pitch-(t.clientY-fy0)*.006));fx0=t.clientX;fy0=t.clientY}
    if(t.identifier===jid){let dx=(t.clientX-jx)/45,dy=(t.clientY-jy)/45;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}mx=dx;my=dy;knob.style.transform=`translate(${dx*36}px,${dy*36}px)`}
    else if(t.identifier===lid){a+=(t.clientX-lx)*.009;pitch=Math.max(-.5,Math.min(.5,pitch-(t.clientY-ly)*.006));lx=t.clientX;ly=t.clientY}
  }
},{passive:false});

const endT=e=>{for(const t of e.changedTouches){if(t.identifier===jid){jid=null;mx=my=0;base.style.display='none';knob.style.transform=''}if(t.identifier===lid)lid=null}};
document.addEventListener('touchend',endT);document.addEventListener('touchcancel',endT);

const fb=$('fire');
fb.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];fid=t.identifier;fx0=t.clientX;fy0=t.clientY;firing=true;audioInit()});
const eF=e=>{if(fid!==null&&!Array.from(e.touches).some(t=>t.identifier===fid)){fid=null;firing=false}};
document.addEventListener('touchend',eF);document.addEventListener('touchcancel',eF);
fb.addEventListener('mousedown',()=>firing=true);addEventListener('mouseup',()=>firing=false);

function startGame(){
  if(!BASE_MODEL)return;
  audioInit();reset();$('hpf').style.width='100%';$('ov').style.display='none';running=true;
}
$('go').addEventListener('touchstart',e=>{e.preventDefault();startGame()});
$('go').addEventListener('click',startGame);

reset();let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(running)update(dt);draw(dt);requestAnimationFrame(loop)})(last);
